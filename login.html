<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IMRS - Manager Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      background: linear-gradient(rgba(9, 13, 22, 0.75), rgba(9, 13, 22, 0.9)), url('background2.png') no-repeat center center fixed;
      background-size: cover;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .login-container {
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(16px);
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      border-radius: 0px;
      border: 3px solid #3b82f6;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-container img {
      max-height: 50px;
      width: auto;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    input[type="email"] {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 2px solid #374151;
      border-radius: 0px;
      outline: none;
      background: #1f2937;
      color: #ffffff;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .error-msg {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid #dc2626;
      color: #fca5a5;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
      border-radius: 0px;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      background: #2563eb;
      color: white;
      border: 2px solid #2563eb;
      border-radius: 0px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-login:hover {
      background: #1d4ed8;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 22px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="header">
      <div class="logo-container">
        <img src="logo.png" alt="Imerch Logo">
      </div>
      <h1>IMRS Portal Access</h1>
      <p>Managers & Admin Portal Only</p>
    </div>

    <div class="error-msg" id="errorMsg">
      ⚠️ Access Denied. Ang email na ito ay hindi awtorisado sa sistema.
    </div>

    <div class="form-group">
      <label>Authorized Company Email</label>
      <input type="email" id="companyEmail" placeholder="pangalan@imerchmedia.net" autocomplete="off" autocapitalize="none">
    </div>

    <button class="btn-login" onclick="validateLogin()">Mag-login sa Portal</button>

    <div class="footer-note">
      &copy; 2026 iMerch Media Inc. | System Developed By Ron Sarmenta<br>
      <strong>Love Care Share Communicate Trust</strong>
    </div>
  </div>

  <script>
    // Whitelist ng mga authorized managers at admin
    const allowedEmails = [
      "gladys.deguzman@imerchmedia.net",
      "joy.biazon@imerchmedia.net",
      "jan.evangelista@imerchmedia.net",
      "ronnel.gingco@imerchmedia.net",
      "jerome.ore@imerchmedia.net",
      "edgar.namoro@imerchmedia.net",
      "julie.jalandoon@imerchmedia.net",
      "roxanne.fernando@imerchmedia.net",
      "ron.sarmenta@imerchmedia.net" // Admin
    ];

    document.getElementById("companyEmail").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        validateLogin();
      }
    });

    function validateLogin() {
      const emailInput = document.getElementById("companyEmail").value.trim().toLowerCase();
      const errorDiv = document.getElementById("errorMsg");

      if (!emailInput) {
        errorDiv.innerText = "⚠️ Pakilagay ang iyong company email.";
        errorDiv.style.display = "block";
        return;
      }

      if (!allowedEmails.includes(emailInput)) {
        errorDiv.innerText = "⚠️ Unauthorized Email! Tanging mga nakatalagang Manager at Admin lamang ang pinapayagan.";
        errorDiv.style.display = "block";
        return;
      }

      errorDiv.style.display = "none";
      
      // I-save sa sessionStorage bilang backup session
      sessionStorage.setItem("userEmail", emailInput);
      
      // Paglipat papunta sa portal.html (Attendance Portal)
      window.location.href = "portal.html?email=" + encodeURIComponent(emailInput);
    }
  </script>
</body>
</html>
